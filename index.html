<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tools</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    main {
      width: 100%;
      max-width: 400px;
    }

    .nav-grid {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .nav-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .nav-card:hover,
    .nav-card:focus-visible {
      border-color: var(--accent);
      background-color: #26334d;
      outline: none;
    }

    .arrow {
      color: var(--accent);
      font-size: 1.25rem;
      line-height: 1;
    }
  </style>
</head>
<body>

  <main>
    <nav class="nav-grid">
      <a href="dual.html" class="nav-card">
        <span>Dual View</span>
        <span class="arrow">&rarr;</span>
      </a>
      <a href="resize.html" class="nav-card">
        <span>Resize Tool</span>
        <span class="arrow">&rarr;</span>
      </a>
    </nav>
  </main>

</body>
</html>
