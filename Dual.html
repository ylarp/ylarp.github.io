<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robust Dual PDF Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: #111;
            font-family: sans-serif;
        }

        .pane {
            flex: 1;
            width: 100%;
            height: 50vh;
            position: relative;
            border-bottom: 1px solid #333;
            background: #222;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .pane:last-child {
            border-bottom: none;
        }

        .upload-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            cursor: pointer;
            z-index: 5;
            text-align: center;
            padding: 20px;
            background: #222;
        }

        .upload-screen input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .pdf-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 15px;
            min-height: 100%;
        }

        canvas {
            max-width: 100%;
            height: auto !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.6);
            background: #fff;
        }
    </style>
</head>
<body>

    <!-- Top Pane -->
    <div class="pane" id="paneTop">
        <div class="upload-screen" id="promptTop">
            Tap here to load Top PDF
            <input type="file" accept="application/pdf" onchange="loadPDF(event, 'paneTop', 'promptTop')">
        </div>
    </div>

    <!-- Bottom Pane -->
    <div class="pane" id="paneBottom">
        <div class="upload-screen" id="promptBottom">
            Tap here to load Bottom PDF
            <input type="file" accept="application/pdf" onchange="loadPDF(event, 'paneBottom', 'promptBottom')">
        </div>
    </div>

    <script>
        async function loadPDF(event, paneId, promptId) {
            const file = event.target.files[0];
            if (!file || file.type !== 'application/pdf') return;

            const pane = document.getElementById(paneId);
            document.getElementById(promptId).style.display = 'none';

            // Clean up existing container if reloading
            const oldContainer = pane.querySelector('.pdf-container');
            if (oldContainer) oldContainer.remove();

            const container = document.createElement('div');
            container.className = 'pdf-container';
            pane.appendChild(container);

            try {
                const arrayBuffer = await file.arrayBuffer();
                const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                const pdf = await loadingTask.promise;

                // Loop through and render every single page sequentially
                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    
                    // Scale down slightly for mobile performance and stability
                    const viewport = page.getViewport({ scale: 1.2 });

                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    container.appendChild(canvas);

                    await page.render({
                        canvasContext: context,
                        viewport: viewport
                    }).promise;
                }
            } catch (err) {
                console.error("Error loading PDF:", err);
                alert("Error loading PDF file. Please try another file.");
            }
        }
    </script>

</body>
</html>
